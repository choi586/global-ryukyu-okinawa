<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고립을 읽다, 곁을 잇다 — 모션 인트로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 사회적연결회복 컨소시엄 사업단 모션 인트로 (약 10초).
   기본 스타일이 곧 마지막 장면이고, .is-playing 이 붙으면 처음부터 재생합니다.
   .mg 는 컨테이너 단위(cq*)로만 크기를 잡으므로 어떤 박스에 넣어도 비율이 유지됩니다. */
html, body { height: 100%; margin: 0; background: #071523; }
.mg {
  --ink: #071523;
  --ice: #d6eef2;
  --cyan: #a5dbe0;
  --mist: #8fa6b2;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  container-type: size;
  width: 100%;
  height: 100svh;
  min-height: 420px;
  overflow: hidden;
  color: #fff;
  background: var(--ink);
  font-family: 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  word-break: keep-all;
}
.mg *, .mg *::before, .mg *::after { box-sizing: border-box; }
.mg p, .mg h1 { margin: 0; }

/* 지도 */
.mg-canvas {
  position: absolute;
  top: 50%;
  left: 64%;
  width: max(128cqw, 100cqh * 16 / 9 * 1.28);
  aspect-ratio: 16 / 9;
  transform: translate(-50%, -50%);
}
.mg-zoom { position: absolute; inset: 0; transform-origin: 44% 48%; }
.mg-zoom > img, .mg-zoom > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mg-shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(7, 21, 35, 0.92) 0%, rgba(7, 21, 35, 0.62) 30%, transparent 54%),
    linear-gradient(0deg, rgba(7, 21, 35, 0.85) 0%, transparent 26%),
    linear-gradient(180deg, rgba(7, 21, 35, 0.6) 0%, transparent 18%);
}
.mg-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.16; mix-blend-mode: overlay; pointer-events: none; }

/* 선 */
.mg-gap { fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-dasharray: 0.012 0.022; opacity: 0; }
.mg-line { fill: none; stroke: var(--ice); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.mg-glow { fill: none; stroke: var(--cyan); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 0.35; filter: blur(6px); }
.mg-comet { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0.035 0.965; filter: drop-shadow(0 0 6px #a5dbe0); animation: mg-comet 7s linear infinite; }
.mg-ring { fill: none; stroke: var(--ice); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: mg-ring 3.2s ease-out infinite; }
.mg-ring.r2 { animation-delay: 1s; }
.mg-ring.r3 { animation-delay: 2s; }
.mg-dot { fill: #fff; }

/* 지명 */
.mg-pin { position: absolute; display: grid; gap: 0.2em; padding-left: 1.5em; line-height: 1.15; white-space: nowrap; transform: translateY(-50%); font-size: clamp(11px, 1.9cqmin, 17px); }
.mg-pin b { font-weight: 500; letter-spacing: 0.02em; }
.mg-pin i { font-style: normal; font-size: 0.68em; letter-spacing: 0.14em; color: var(--cyan); font-variant-numeric: tabular-nums; }
.mg-pin.j { top: 26.82%; left: 50.09%; }
.mg-pin.o { top: 62.38%; left: 53.81%; }
.mg-pin.t { top: 68.09%; left: 34.09%; padding: 0 1.5em 0 0; text-align: right; transform: translate(-100%, -50%); }

/* 상단·하단 */
.mg-top { position: absolute; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: clamp(18px, 4cqh, 36px) 6cqw 0; font-size: clamp(11px, 1.7cqmin, 14px); letter-spacing: 0.04em; }
.mg-top span:last-child { color: var(--mist); letter-spacing: 0.14em; font-variant-numeric: tabular-nums; }
.mg-top img { height: 1.9em; width: auto; vertical-align: middle; margin-right: 0.8em; }
.mg-bottom { position: absolute; inset: auto 0 0; display: flex; align-items: center; gap: 18px; padding: 0 6cqw clamp(18px, 4cqh, 34px); font-size: clamp(11px, 1.6cqmin, 13px); color: var(--mist); letter-spacing: 0.14em; }
.mg-steps { display: flex; gap: 1.4em; }
.mg-steps span { color: #fff; }
.mg-track { position: relative; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.18); }
.mg-track::after { content: ''; position: absolute; inset: 0; background: var(--ice); transform-origin: left; }
.mg-replay { padding: 0.6em 1.3em; color: #fff; background: none; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 999px; font: inherit; letter-spacing: 0.06em; cursor: pointer; }
.mg-replay:hover { background: #fff; color: var(--ink); }
.mg-replay:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

/* 글자 */
.mg-copy { position: absolute; left: 6cqw; top: 50%; width: 46cqw; transform: translateY(-50%); }
.mg-act { position: absolute; left: 0; top: 50%; transform: translateY(-58%); pointer-events: none; }
.mg-mask { display: block; overflow: hidden; }
.mg-mask > * { display: block; }
.mg-word { font-size: clamp(110px, 34cqmin, 340px); font-weight: 900; line-height: 1.08; letter-spacing: -0.05em; transform: translateY(-110%); }
.mg-cap { margin-top: 0.6em; font-size: clamp(14px, 2.5cqmin, 22px); font-weight: 500; color: var(--ice); transform: translateY(-140%); }
.mg-no { margin-bottom: 0.4em; font-size: clamp(11px, 1.7cqmin, 14px); letter-spacing: 0.2em; color: var(--cyan); opacity: 0; }
.mg-final .mg-kicker { font-size: clamp(12px, 1.9cqmin, 16px); font-weight: 500; letter-spacing: 0.06em; color: var(--cyan); margin-bottom: 1.4em; }
.mg-final h1 { font-size: clamp(38px, 9.4cqmin, 104px); font-weight: 900; line-height: 1.2; letter-spacing: -0.05em; }
.mg-final .mg-en { margin-top: 1.5em; font-size: clamp(10px, 1.7cqmin, 15px); letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.72); }
.mg-final .mg-org { display: flex; align-items: center; gap: 1em; margin-top: 2.2em; font-size: clamp(12px, 1.9cqmin, 16px); color: rgba(255, 255, 255, 0.9); }
.mg-final .mg-org img { width: 4.6em; height: auto; }
.mg-final .mg-org small { display: block; font-size: 0.82em; color: var(--mist); }

/* 세로 화면: 글자는 위, 지도는 아래 */
@container (max-aspect-ratio: 1 / 1) {
  .mg-canvas { width: 290cqw; left: -77.6cqw; top: calc(70cqh - 77.4cqw); transform: none; }
  .mg-shade { background: linear-gradient(180deg, rgba(7, 21, 35, 0.95) 0%, rgba(7, 21, 35, 0.7) 34%, transparent 52%), linear-gradient(0deg, rgba(7, 21, 35, 0.9) 0%, transparent 18%); }
  .mg-copy { top: 15cqh; width: 88cqw; transform: none; }
  .mg-act { top: 0; transform: none; }
  .mg-word { font-size: clamp(96px, 40cqw, 220px); }
  .mg-top span:last-child, .mg-steps { display: none; }
  .mg-pin i { display: none; }
}

/* ── 재생 ── */
.mg.is-playing .mg-zoom { animation: mg-zoom 10s var(--ease) both; }
.mg.is-playing .mg-zoom > img { animation: mg-fade 1.6s ease both; }
.mg.is-playing .mg-dots { animation: mg-fade 0.8s ease 0.6s both; }
.mg.is-playing .mg-pin { animation: mg-rise 0.7s var(--ease) both; }
.mg.is-playing .mg-pin.j { animation-delay: 1s; }
.mg.is-playing .mg-pin.o { animation-delay: 1.25s; }
.mg.is-playing .mg-pin.t { animation-name: mg-rise-t; animation-delay: 1.5s; }
.mg.is-playing .mg-top, .mg.is-playing .mg-bottom { animation: mg-fade 1s ease 0.3s both; }
.mg.is-playing .mg-track::after { animation: mg-track 10s linear both; }

.mg.is-playing .mg-word { animation: mg-word 2.6s var(--ease) both; }
.mg.is-playing .mg-cap { animation: mg-word 2.6s var(--ease) both; }
.mg.is-playing .mg-no { animation: mg-no 2.6s ease both; }
.mg.is-playing .a1 .mg-word, .mg.is-playing .a1 .mg-no { animation-delay: 0.8s; }
.mg.is-playing .a1 .mg-cap { animation-delay: 0.95s; }
.mg.is-playing .a2 .mg-word, .mg.is-playing .a2 .mg-no { animation-delay: 3.2s; }
.mg.is-playing .a2 .mg-cap { animation-delay: 3.35s; }
.mg.is-playing .a3 .mg-word, .mg.is-playing .a3 .mg-no { animation-delay: 5.6s; }
.mg.is-playing .a3 .mg-cap { animation-delay: 5.75s; }

.mg.is-playing .mg-gap { animation: mg-gap 4.4s linear 3.4s both; }
.mg.is-playing .mg-line, .mg.is-playing .mg-glow { animation: mg-draw 0.9s cubic-bezier(0.6, 0, 0.2, 1) both; }
.mg.is-playing .l1 { animation-delay: 5.9s; }
.mg.is-playing .l2 { animation-delay: 6.6s; }
.mg.is-playing .l3 { animation-delay: 7.3s; }
.mg.is-playing .mg-comet { animation: mg-fade 0.6s ease 8.2s both, mg-comet 7s linear 8.2s infinite; }

.mg.is-playing .mg-final .mg-kicker { animation: mg-fade 0.8s ease 8.3s both; }
.mg.is-playing .mg-final h1 span span { animation: mg-up 0.9s var(--ease) both; }
.mg.is-playing .mg-final h1 > span:nth-child(1) span { animation-delay: 8.35s; }
.mg.is-playing .mg-final h1 > span:nth-child(2) span { animation-delay: 8.5s; }
.mg.is-playing .mg-final .mg-en { animation: mg-fade 0.9s ease 9s both; }
.mg.is-playing .mg-final .mg-org { animation: mg-fade 0.9s ease 9.3s both; }

@keyframes mg-fade { from { opacity: 0; } }
@keyframes mg-zoom { from { transform: scale(1.14); } }
@keyframes mg-rise { from { opacity: 0; transform: translateY(-20%); } }
@keyframes mg-rise-t { from { opacity: 0; transform: translate(-100%, -20%); } }
@keyframes mg-track { from { transform: scaleX(0); } }
@keyframes mg-up { from { transform: translateY(110%); } }
@keyframes mg-word { 0% { transform: translateY(110%); } 26%, 80% { transform: none; } 100% { transform: translateY(-140%); } }
@keyframes mg-no { 0%, 100% { opacity: 0; } 26%, 80% { opacity: 1; } }
@keyframes mg-gap { 0% { opacity: 0; } 5% { opacity: 0.7; } 9% { opacity: 0.15; } 14% { opacity: 0.75; } 18% { opacity: 0.3; } 24%, 56% { opacity: 0.6; } 100% { opacity: 0; } }
@keyframes mg-draw { from { stroke-dashoffset: 1; } }
@keyframes mg-comet { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes mg-ring { 0% { transform: scale(0.3); opacity: 0.9; } 70%, 100% { transform: scale(1); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .mg-comet, .mg-ring { animation: none; }
  .mg-comet { display: none; }
  .mg-ring { opacity: 0.5; transform: scale(0.5); }
}
</style>
</head>
